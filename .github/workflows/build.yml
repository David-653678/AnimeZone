

name: Crear APK AnimeZone

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar proyecto
        run: |
          mkdir AnimeZone
          unzip -o AnimeZone-proyecto-inicial.zip -d AnimeZone
      - name: Compilar APK
        run: gradle -p AnimeZone assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeZone-APK
          path: AnimeZone/app/build/outputs/apk/debug/app-debug.apk
          
